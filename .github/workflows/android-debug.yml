name: Android debug APK

on:
  push:
    branches:
      - mobile
    tags:
      - "v*"
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      server_url:
        description: "Optional server origin; omit to discover CoRide on the local network"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      signing_configured: ${{ steps.signing.outputs.configured }}
    env:
      MOBILE_SERVER_URL: ${{ inputs.server_url || vars.MOBILE_SERVER_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Android version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version tag must use vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
          else
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            base_version="${latest_tag#v}"
            if [[ -z "$latest_tag" ]]; then
              base_version="0.1.0"
            fi
            IFS='.' read -r major minor patch <<< "$base_version"
            version="$major.$minor.$((patch + 1))"
          fi

          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Restore persistent Android signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set ANDROID_DEBUG_KEYSTORE_BASE64 to enable installable stable releases."
            exit 0
          fi

          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coride-debug.keystore"
          chmod 600 "$RUNNER_TEMP/coride-debug.keystore"
          echo "MOBILE_DEBUG_KEYSTORE=$RUNNER_TEMP/coride-debug.keystore" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            "-PmobileServerUrl=$MOBILE_SERVER_URL" \
            "-PmobileDebugKeystore=${MOBILE_DEBUG_KEYSTORE:-}" \
            "-PmobileVersionCode=${{ steps.version.outputs.version_code }}" \
            "-PmobileVersionName=${{ steps.version.outputs.version_name }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coride-android-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/mobile')) &&
      needs.build.outputs.signing_configured == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: coride-android-debug
          path: release

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "CoRide Android ${{ needs.build.outputs.version_name }}"
          body: |
            Automated Android APK release.
            Version code: ${{ needs.build.outputs.version_code }}
            APK is signed with the repository's persistent update key and intended for sideloading/testing, not Play Store distribution.
          prerelease: false
          files: release/app-debug.apk
          fail_on_unmatched_files: true
