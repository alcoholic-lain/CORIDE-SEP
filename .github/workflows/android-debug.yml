name: Android debug APK

on:
  push:
    branches:
      - mobile
    tags:
      - "v*"
  pull_request:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      server_url:
        description: "Optional server origin; omit to discover CoRide on the local network"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      MOBILE_SERVER_URL: ${{ inputs.server_url || vars.MOBILE_SERVER_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37 build-tools;36.0.0

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug "-PmobileServerUrl=$MOBILE_SERVER_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coride-android-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: coride-android-debug
          path: release

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: CoRide Android ${{ github.ref_name }}
          body: |
            Install the debug APK on an Android test device.
            This prerelease is for testing only, not for Play Store distribution.
          prerelease: true
          files: release/app-debug.apk
          fail_on_unmatched_files: true
