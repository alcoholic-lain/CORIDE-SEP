<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Zero-Ichi team logo, animated">

<style>
  .head    { animation: bob 2.4s ease-in-out infinite; }
  .tassel  { transform-origin: 165px 58px; animation: swing 2.4s ease-in-out infinite; }
  .leaf    { transform-origin: 282px 262px; animation: sway 2.4s ease-in-out infinite; }
  .berry   { animation: wiggle 2.4s ease-in-out infinite; }
  .ltr     { transform-box: fill-box; transform-origin: 50% 100%;
             animation: hop 2.4s cubic-bezier(.3,.7,.4,1) infinite; animation-delay: calc(var(--i) * .09s); }
  .spark   { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  .spark.b { animation-delay: 1.2s; }
  .pill    { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  .blush   { animation: blush 2.4s ease-in-out infinite; }
  @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes swing  { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
  @keyframes sway   { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes wiggle { 0%,60%,100% { transform: scale(1); } 70% { transform: scale(1.14); } 80% { transform: scale(.94); } 90% { transform: scale(1.04); } }
  @keyframes hop    { 0%,40%,100% { transform: translateY(0) scale(1,1); } 16% { transform: translateY(-16px) scale(.96,1.06); }
                      26% { transform: translateY(0) scale(1.08,.9); } 32% { transform: translateY(-3px); } }
  @keyframes twinkle{ 0%,100% { transform: scale(.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes blush  { 0%,100% { opacity: .75; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

