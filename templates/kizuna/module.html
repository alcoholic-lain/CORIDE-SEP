{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Kizuna</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'kizuna/icon.svg' %}">
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            color: #172f46;
            background: #f2f7f6;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(90vw, 560px);
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .logo {
            display: grid;
            place-items: center;
            min-height: 140px;
        }

        .logo img {
            width: min(320px, 70vw);
            height: auto;
        }

        h1 {
            margin: 1.5rem 0 0.5rem;
        }

        p {
            margin: 0;
            color: #60778a;
        }

        footer {
            margin-top: 2.5rem;
            display: grid;
            place-items: center;
            gap: 0.5rem;
        }

        footer img {
            height: 32px;
            width: auto;
            opacity: 0.85;
        }

        footer span {
            font-size: 0.75rem;
            color: #8694a0;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo">
            <img src="{% static 'kizuna/logo.svg' %}" alt="Kizuna">
        </div>
        <h1>{{ title }}</h1>
        <p>{{ hint }}</p>
        <footer>
            <img src="{% static 'kizuna/partners/esprit-light.png' %}" alt="Esprit">
            <span>Built at Esprit</span>
        </footer>
    </main>
</body>
</html>
